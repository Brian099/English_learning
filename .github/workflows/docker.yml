name: build-image

# 推送到 main 自动构建镜像并推到 Docker Hub（brian9909/moer）
# NAS 上只要 docker compose pull 就能更新，不需要在 NAS 上装构建环境
#
# 需要在仓库里配置两个 Secrets（Settings → Secrets and variables → Actions）：
#   DOCKERHUB_USERNAME = brian9909
#   DOCKERHUB_TOKEN    = Docker Hub 的 Access Token（不是登录密码）
# 没配置时工作流会自动跳过构建，不会报红。

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查凭据是否已配置
        id: check
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::warning::缺少 DOCKERHUB_TOKEN，跳过构建。请在 Settings → Secrets 里配置。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备 Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成标签
        if: steps.check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: brian9909/moer
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 构建并推送
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          # N100 是 x86_64，只构建 amd64 就够，构建更快
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
