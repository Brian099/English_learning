<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d6bfa">
<title>听英语 · 学生端</title>
<link rel="stylesheet" href="/student.css?v=8">
</head>
<body>

<!-- 1. 配对 -->
<section id="screen-pair" class="screen hidden">
  <div class="pair-box">
    <div class="logo">🎧</div>
    <h1>一起听英语吧</h1>
    <p class="hint">请家长给你 6 位数字</p>
    <input id="pair-code" class="code-input" inputmode="numeric" maxlength="6"
           placeholder="······" autocomplete="off">
    <button id="pair-btn" class="big-btn">开始</button>
    <p id="pair-error" class="err"></p>
  </div>
</section>

<!-- 2. 今日任务 -->
<section id="screen-home" class="screen hidden">
  <header class="topbar">
    <div>
      <div class="hello" id="hello-name">你好</div>
      <div class="sub" id="today-summary">今天还没有听哦</div>
    </div>
    <button id="switch-device" class="icon-btn" title="换设备">⚙</button>
  </header>

  <div class="progress-card">
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120" class="ring">
        <circle cx="60" cy="60" r="52" class="ring-bg"></circle>
        <circle cx="60" cy="60" r="52" class="ring-fg" id="ring-fg"></circle>
      </svg>
      <div class="ring-text">
        <div class="ring-num" id="ring-min">0</div>
        <div class="ring-unit">分钟</div>
      </div>
    </div>
    <div class="progress-info">
      <div class="goal">目标 <b id="target-min">20</b> 分钟</div>
      <div class="done-count" id="done-count">已完成 0 集</div>
      <button id="start-btn" class="big-btn play-btn">▶ 开始听</button>
    </div>
  </div>

  <h2 class="section-title">今天要听</h2>
  <div id="task-list" class="task-list"></div>

  <div class="tabs">
    <button class="tab active" data-view="tasks">听</button>
    <button class="tab" data-view="history">记录</button>
  </div>

  <div id="history-view" class="history hidden"></div>
</section>

<!-- 3. 播放器 -->
<section id="screen-player" class="screen player hidden">
  <button id="player-back" class="icon-btn back">‹ 返回</button>

  <div class="mode-switch" id="mode-switch">
    <button class="mode-btn active" data-mode="audio">🎧 听</button>
    <button class="mode-btn" data-mode="video">📺 看</button>
  </div>

  <div class="media-stage">
    <div class="cover-art" id="cover-art">🎧</div>
    <video id="video" class="media-video hidden" playsinline preload="metadata"></video>
  </div>

  <div class="cover">
    <div class="cover-title" id="player-title">—</div>
    <div class="cover-meta" id="player-meta"></div>
  </div>

  <div class="seek">
    <div class="seek-bar"><div class="seek-fill" id="seek-fill"></div></div>
    <div class="seek-time"><span id="cur-time">0:00</span><span id="dur-time">0:00</span></div>
  </div>

  <div class="controls">
    <button id="btn-prev" class="icon-btn">⏮</button>
    <button id="btn-play" class="round-btn">▶</button>
    <button id="btn-next" class="icon-btn">⏭</button>
  </div>

  <div class="extras">
    <button id="btn-loop" class="chip">🔁 单集循环</button>
    <button id="btn-rate" class="chip">1.0×</button>
    <button id="btn-voice" class="chip">🎚 人声增强</button>
    <button id="btn-mask" class="chip hidden">🙈 遮字幕</button>
    <label class="chip mask-slider hidden" id="mask-slider-wrap">
      高度 <input type="range" id="mask-height" min="8" max="40" step="2" value="20">
      <span id="mask-value">20%</span>
    </label>
  </div>

  <div class="volume-row">
    <span class="vol-icon">🔈</span>
    <input type="range" id="volume" min="0" max="100" step="5" value="100">
    <span class="vol-value" id="volume-value">100%</span>
  </div>
  <p class="tip" id="volume-tip"></p>

  <p class="tip" id="player-tip">熄屏也能继续听哦</p>
  <button id="repair-btn" class="chip hidden" style="margin:0 auto;display:block">🔗 配对已失效，点这里重新配对</button>

  <!-- 硬字幕遮挡条：素材是双行双语艺术字，关不掉，只能盖住 -->
  <div class="subtitle-mask" id="subtitle-mask"></div>
  <audio id="audio" preload="metadata"></audio>
</section>

<div id="toast" class="toast hidden"></div>
<script src="/student.js?v=8"></script>
</body>
</html>
