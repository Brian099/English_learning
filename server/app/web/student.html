<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>听英语 · 学生端</title>
<link rel="stylesheet" href="/student.css?v=11">
</head>
<body>

<!-- 1. 配对 -->
<section id="screen-pair" class="screen hidden">
  <div class="pair-box">
    <div class="logo">🎧</div>
    <h1>一起听英语吧</h1>
    <p class="hint">请家长给你 6 位数字</p>
    <input id="pair-code" class="code-input" inputmode="numeric" maxlength="6"
           placeholder="······" autocomplete="off">
    <button id="pair-btn" class="big-btn">开始</button>
    <p id="pair-error" class="err"></p>
  </div>
</section>

<!-- 2. 今日任务 -->
<section id="screen-home" class="screen hidden">
  <header class="topbar">
    <div>
      <div class="hello" id="hello-name">你好</div>
      <div class="sub" id="today-summary">今天还没有听哦</div>
    </div>
    <button id="switch-device" class="icon-btn" title="换设备">⚙</button>
  </header>

  <div class="progress-card">
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120" class="ring">
        <circle cx="60" cy="60" r="52" class="ring-bg"></circle>
        <circle cx="60" cy="60" r="52" class="ring-fg" id="ring-fg"></circle>
      </svg>
      <div class="ring-text">
        <div class="ring-num" id="ring-min">0</div>
        <div class="ring-unit">分钟</div>
      </div>
    </div>
    <div class="progress-info">
      <div class="goal">目标 <b id="target-min">20</b> 分钟</div>
      <div class="done-count" id="done-count">已完成 0 集</div>
      <button id="start-btn" class="big-btn play-btn">▶ 开始听</button>
    </div>
  </div>

  <h2 class="section-title">今天要听</h2>
  <div id="task-list" class="task-list"></div>

  <div class="tabs">
    <button class="tab active" data-view="tasks">听</button>
    <button class="tab" data-view="history">记录</button>
  </div>

  <div id="history-view" class="history hidden"></div>
</section>

<!-- 3. 播放器：抖音式全屏上下滑 -->
<section id="screen-player" class="feed hidden">

  <!-- 顶部：返回 + 进度 + 常用按钮 -->
  <div class="hud-top">
    <button id="player-back" class="hud-btn" title="返回任务">‹</button>
    <div class="hud-info">
      <div class="hud-name" id="hud-name">—</div>
      <div class="hud-sub" id="hud-progress">0 / 0</div>
    </div>
    <div class="hud-actions">
      <button id="btn-autolevel" class="hud-chip on" title="响度校正">🔊</button>
      <button id="btn-mask" class="hud-chip hidden" title="遮字幕">🙈</button>
      <button id="btn-loop" class="hud-chip" title="单集循环">🔁</button>
      <button id="btn-more" class="hud-chip" title="更多">⋯</button>
    </div>
  </div>

  <!-- 舞台：视频或封面 -->
  <div class="stage" id="stage">
    <video id="video" class="stage-video" playsinline preload="metadata"></video>
    <div class="cover-art hidden" id="cover-art">🎧</div>

    <div class="stage-caption">
      <div class="cover-title" id="player-title">—</div>
      <div class="cover-meta" id="player-meta"></div>
    </div>

    <!-- 硬字幕遮挡条（在看模式下盖住画面底部） -->
    <div class="subtitle-mask off" id="subtitle-mask"></div>

    <!-- 中央播放键 -->
    <button id="btn-play" class="round-btn">▶</button>
  </div>

  <!-- 底部：进度 + 提示 -->
  <div class="hud-bottom">
    <div class="seek">
      <div class="seek-bar"><div class="seek-fill" id="seek-fill"></div></div>
      <div class="seek-time"><span id="cur-time">0:00</span><span id="dur-time">0:00</span></div>
    </div>
    <p class="tip" id="player-tip">上滑切换下一集</p>
    <button id="repair-btn" class="repair hidden">🔗 配对已失效，点这里重新配对</button>
  </div>

  <!-- 展开面板：不常用按钮 -->
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>

    <div class="sheet-row">
      <span class="sheet-label">模式</span>
      <div class="mode-switch" id="mode-switch">
        <button class="mode-btn" data-mode="video">📺 看</button>
        <button class="mode-btn active" data-mode="audio">🎧 听</button>
      </div>
    </div>

    <div class="sheet-row">
      <span class="sheet-label">倍速</span>
      <button id="btn-rate" class="chip">1.0×</button>
      <button id="btn-voice" class="chip">🎚 人声增强</button>
    </div>

    <div class="sheet-row">
      <span class="sheet-label">音量</span>
      <input type="range" id="volume" min="0" max="100" step="5" value="100">
      <span class="vol-value" id="volume-value">100%</span>
    </div>

    <div class="sheet-row hidden" id="mask-slider-wrap">
      <span class="sheet-label">遮罩</span>
      <input type="range" id="mask-height" min="8" max="40" step="2" value="20">
      <span class="vol-value" id="mask-value">20%</span>
    </div>

    <div class="sheet-row">
      <button id="btn-prev" class="chip">⏮ 上一集</button>
      <button id="btn-next" class="chip">⏭ 下一集</button>
    </div>

    <p class="tip" id="volume-tip"></p>
  </div>

  <audio id="audio" preload="metadata"></audio>
</section>

<div id="toast" class="toast hidden"></div>
<script src="/student.js?v=11"></script>
</body>
</html>
