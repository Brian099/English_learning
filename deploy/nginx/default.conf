server {
    listen 8080;
    server_name _;

    client_max_body_size 2m;
    server_tokens off;

    # ---- 视频直出 ----
    # internal：外部不能直接访问，只能由 api 通过 X-Accel-Redirect 触发，
    # 因此每个字节的访问都过了设备令牌校验。Range 由 nginx 自动处理。
    location /_media/ {
        internal;
        alias /media/;
        sendfile on;
        tcp_nopush on;
        aio threads;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, max-age=3600" always;
    }

    # ---- API ----
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 扫描大目录时可能超过 60s
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 不要屏蔽 X-Accel-Redirect（默认就是透传，这里显式说明不要加 ignore）
    }

    location = / {
        return 200 "kids-english-listening api up\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
