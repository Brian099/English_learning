name: kids-english-listening

# 可选：带内置 nginx 的两容器版本。
#
# 什么时候需要它？
#   - 前面没有自己的反向代理，想让这套服务直接对外提供 HTTP
#   - 想让 nginx 直接发文件、API 完全不碰字节（CPU 占用更低）
#
# 用法和 docker-compose.yml 一样，只是文件名不同：
#   docker compose -f docker-compose.nginx.yml up -d
#
# 注意：这个版本用 8080 端口（nginx），不是 8000。

services:
  api:
    image: brian9909/moer:latest
    environment:
      TZ: Asia/Shanghai
      # 有 nginx 时只回 X-Accel-Redirect，由 nginx 直出
      SERVE_MEDIA: accel
      AUTO_INGEST: "1"
      NORMALIZE_AUDIO: "1"
      NORMALIZE_VIDEO: "0"
      TARGET_LUFS: "-16"
      WHISPER_MODEL: small.en
      WHISPER_THREADS: "3"
      PARENT_PASSWORD: kids1234
    volumes:
      # ↓↓↓ 改这一行 ↓↓↓
      - /vol1/1000/media/english-kids:/media:ro
      - ./data:/data
      - ./data/cache:/cache
      - ./data/models:/models
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "18080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx 要能读到文件才能做 X-Accel-Redirect 直出，路径必须和上面一致
      - /vol1/1000/media/english-kids:/media:ro
    depends_on:
      - api
    restart: unless-stopped
