name: kids-english-listening

# 飞牛 fnOS 部署用的自包含 compose —— 整个目录拷到 NAS 就能跑。
# 镜像从 Docker Hub 拉取，不需要源码、不需要在 NAS 上构建。
#
# 用法：
#   1. cp .env.example .env   然后改 MEDIA_ROOT / APP_SECRET / PARENT_PASSWORD
#   2. docker compose pull && docker compose up -d
#
# 想从源码自己构建：把仓库整体 clone 下来，在仓库的 deploy/ 目录里
# 把下面 api 服务的 build 段取消注释即可（context 指向 ../server）。

services:
  api:
    image: brian9909/moer:latest
    # build:
    #   context: ../server
    environment:
      MEDIA_ROOT: /media
      CACHE_ROOT: /cache
      # 4 个斜杠 = 容器内绝对路径 /data/kids.db
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/kids.db}
      # 生产用 nginx 直出（API 不搬运字节）；本地开发没 nginx 时设 direct
      SERVE_MEDIA: ${SERVE_MEDIA:-accel}
      # 扫描到新视频后自动转音频 + 提取对白
      AUTO_INGEST: ${AUTO_INGEST:-1}
      WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
      WHISPER_THREADS: ${WHISPER_THREADS:-3}
      MODEL_DIR: /models
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      APP_SECRET: ${APP_SECRET:?请在 .env 里设置 APP_SECRET}
      PARENT_PASSWORD: ${PARENT_PASSWORD:?请在 .env 里设置 PARENT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 视频目录：只读挂载，容器内无法写
      - ${MEDIA_ROOT:?请在 .env 里设置 MEDIA_ROOT}:/media:ro
      - ./data/cache:/cache
      # 数据库文件所在目录（必须是 NAS 本地盘，不要放 SMB/NFS 共享）
      - ./data/sqlite:/data
      # 转写模型缓存（首次运行会下载约 480MB，挂卷避免重建容器后重下）
      - ./data/models:/models
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-18080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx 需要能读到文件才能做 X-Accel-Redirect 直出
      - ${MEDIA_ROOT:?请在 .env 里设置 MEDIA_ROOT}:/media:ro
    depends_on:
      - api
    restart: unless-stopped

