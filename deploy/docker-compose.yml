name: kids-english-listening

# 默认用 SQLite：单文件、零运维、备份就是拷一个文件。
# 需要 Postgres 时，取消文件末尾 postgres 服务的注释并改 DATABASE_URL 即可。

services:
  api:
    # 用 GitHub Actions 自动构建好的镜像（Docker Hub，公开可拉）
    # 想自己构建就加 --build，会以同名 tag 覆盖本地镜像
    image: brian9909/moer:latest
    build:
      context: ../server
    environment:
      MEDIA_ROOT: /media
      CACHE_ROOT: /cache
      # 4 个斜杠 = 容器内绝对路径 /data/kids.db
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/kids.db}
      # 生产用 nginx 直出（API 不搬运字节）；本地开发没 nginx 时设 direct
      SERVE_MEDIA: ${SERVE_MEDIA:-accel}
      APP_SECRET: ${APP_SECRET:?请在 .env 里设置 APP_SECRET}
      PARENT_PASSWORD: ${PARENT_PASSWORD:?请在 .env 里设置 PARENT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 视频目录：只读挂载，容器内无法写
      - ${MEDIA_ROOT:?请在 .env 里设置 MEDIA_ROOT}:/media:ro
      - ./data/cache:/cache
      # 数据库文件所在目录（必须是 NAS 本地盘，不要放 SMB/NFS 共享）
      - ./data/sqlite:/data
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-18080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx 需要能读到文件才能做 X-Accel-Redirect 直出
      - ${MEDIA_ROOT:?请在 .env 里设置 MEDIA_ROOT}:/media:ro
    depends_on:
      - api
    restart: unless-stopped

