name: kids-english-listening

# 飞牛 fnOS 部署用 —— 单容器、零配置：改下面那一行媒体路径就能跑。
#
#   docker compose up -d
#
# 只有一个 api 容器：后端 + 前端页面 + 媒体按 Range 直发。
# 实测直发 165 MB/s，1080p 播放只需 0.3 MB/s，不需要额外的 nginx。
# HTTPS 交给你的反向代理。

services:
  api:
    image: brian9909/moer:latest
    environment:
      TZ: Asia/Shanghai
      # 扫描到新视频后自动：统一音量 → 转音频 → 提取对白 → 难度分级
      AUTO_INGEST: "1"
      NORMALIZE_AUDIO: "1"
      NORMALIZE_VIDEO: "0"
      TARGET_LUFS: "-16"
      # 转写成功后删除 ASR 输入的 wav（32KB/s 不压缩，很占地方）
      # 设成 1 可保留，调试用
      KEEP_ASR_WAV: "0"
      WHISPER_MODEL: small.en
      WHISPER_THREADS: "3"
      # 家长端登录密码：建议改成自己的
      PARENT_PASSWORD: kids1234
      # APP_SECRET 不用填，首次启动自动生成并存到 ./data/.app_secret
    ports:
      # 只暴露这一个 HTTP 端口，前面接你自己的反代做 HTTPS
      - "18080:8000"
    volumes:
      # ↓↓↓ 只改这一行：你的视频目录（宿主机绝对路径）↓↓↓
      - /vol1/1000/media/english-kids:/media:ro
      # 数据库 + 密钥 + 缓存 + 转写模型，都落在 compose 同级的 data/ 下
      - ./data:/data
      - ./data/cache:/cache
      - ./data/models:/models
    restart: unless-stopped
