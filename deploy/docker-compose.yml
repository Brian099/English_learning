name: kids-english-listening

# 飞牛 fnOS 部署用 —— 零配置：改下面那一行媒体路径就能跑。
# 不需要 .env，不需要在 NAS 上构建，镜像从 Docker Hub 拉取。
#
#   docker compose up -d
#
# 只暴露一个 HTTP 端口，HTTPS 交给你的反向代理。

services:
  api:
    image: brian9909/moer:latest
    environment:
      TZ: Asia/Shanghai
      # 媒体由前置 nginx 直出（API 不搬运字节）
      SERVE_MEDIA: accel
      # 扫描到新视频后自动：统一音量 → 转音频 → 提取对白 → 难度分级
      AUTO_INGEST: "1"
      NORMALIZE_AUDIO: "1"
      NORMALIZE_VIDEO: "0"
      TARGET_LUFS: "-16"
      WHISPER_MODEL: small.en
      WHISPER_THREADS: "3"
      # 家长端登录密码：不填就是 kids1234，建议改成自己的
      PARENT_PASSWORD: kids1234
      # APP_SECRET 不用填，首次启动自动生成并存到 ./data/.app_secret
    volumes:
      # ↓↓↓ 只改这一行：你的视频目录（宿主机绝对路径）↓↓↓
      - /vol1/1000/media/english-kids:/media:ro
      # 数据库 + 密钥 + 缓存 + 转写模型，都落在 compose 同级的 data/ 下
      - ./data:/data
      - ./data/cache:/cache
      - ./data/models:/models
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      # 只暴露这一个 HTTP 端口，前面接你自己的反代做 HTTPS
      - "18080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx 要能读到文件才能做 X-Accel-Redirect 直出，路径必须和上面一致
      - /vol1/1000/media/english-kids:/media:ro
    depends_on:
      - api
    restart: unless-stopped
